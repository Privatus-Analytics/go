name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
      - name: Ask the Go module proxy and pkg.go.dev to index the tag
        run: |
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
            go list -m "github.com/Privatus-Analytics/go@$GITHUB_REF_NAME"
